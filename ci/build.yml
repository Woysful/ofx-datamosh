name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x86_64
            configure: -DCMAKE_BUILD_TYPE=Release
            build: --config Release
          - os: windows-latest
            name: windows-x64
            configure: -A x64
            build: --config Release
          - os: macos-latest
            name: macos-universal
            configure: -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
            build: --config Release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch OpenFX headers
        run: git clone --depth 1 https://github.com/AcademySoftwareFoundation/openfx.git third_party/openfx
      - name: Configure
        run: cmake -S . -B build -DBUILD_TOOLS=OFF ${{ matrix.configure }}
      - name: Build
        run: cmake --build build ${{ matrix.build }}
      - name: Stage archive
        shell: bash
        run: |
          mkdir -p stage
          cp -R build/Datamosh.ofx.bundle stage/
          cp README.md LICENSE install.sh install.ps1 stage/
          cd stage
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a ../ofx-datamosh-${{ matrix.name }}.zip .
          else
            zip -r ../ofx-datamosh-${{ matrix.name }}.zip .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ofx-datamosh-${{ matrix.name }}
          path: ofx-datamosh-${{ matrix.name }}.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ofx-datamosh-${{ matrix.name }}.zip
